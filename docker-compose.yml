services:
  nginx:
    image: nginx:1.29
    container_name: nginx-container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./credentials/cert.pem:/etc/nginx/certs/cert.pem
      - ./credentials/cert.key:/etc/nginx/certs/cert.key
    ports:
      - "8090:8090" # Auth
    networks:
      - internal
    depends_on:
      keycloak:
        condition: service_started
      spring:
        condition: service_started
      notification:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak-container
    command: start
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin

      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-container:5432/kc_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres

      - KC_HOSTNAME=https://localhost:8090
      - KC_HOSTNAME_ADMIN=https://localhost:8090
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./keycloak-providers:/opt/keycloak/providers
      - ./keycloak-themes:/opt/keycloak/themes

  postgres:
    image: postgres:18
    container_name: postgres-container
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kc_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  This is for cache backend data
  redis:
    image: redis:8
    container_name: redis-container
    networks:
      - internal
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring:
    container_name: spring-container
    build:
      context: ./spring
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-container
    networks:
      - internal
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-container:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-container:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-container
    networks:
      - internal
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-container:9092
    depends_on:
      kafka:
        condition: service_healthy

  notification:
    container_name: notification-container
    build:
      context: ./spring-notification
      dockerfile: Dockerfile
    # host port 노출 없음 — gateway(nginx 8090) 경유만 (zero-trust 정합).
    networks:
      - internal
    depends_on:
      mysql-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  mysql-notification:
    image: mysql:9.6
    container_name: mysql-notification-container
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql-notification-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-notification-data:/var/lib/mysql
    ports:
      - "127.0.0.1:13307:3306"  # host access for DataGrip; container internal stays on 3306
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:9.6
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
      - mysql-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306"  # 3306 blocked on Windows by hidden TCP reservation; host tools (DataGrip 등) use 13306
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-s3:
    container_name: seaweedfs-s3
    image: chrislusf/seaweedfs:4.23
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./credentials/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-s3-data:/data
    ports:
      - "9000:8333"  # S3 API
      - "19333:9333"  # Master (host 9333 blocked by Windows winnat 9278-9377)
      - "8888:8888"
    networks:
      - internal

volumes:
  mysql-db-data:
  mysql-notification-data:
  postgres-db-data:
  redis-data:
  seaweedfs-s3-data:
  kafka-data:

networks:
  internal:
    driver: bridge
