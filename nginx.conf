
worker_processes auto;
events {
    worker_connections 1024;
}

http{
    include /etc/nginx/mime.types;
        default_type application/octet-stream;
    server {
    listen 8090 ssl;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # 공통 프록시 헤더 (모든 location 상속)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    # notification 서비스 (Phase 1에서 분리됨)
    location /api/notif/ {
        proxy_pass http://notification-container:8080;
    }

    # post (메인 spring 백엔드, context-path=/api/post)
    location /api/post/ {
        proxy_pass http://spring-container:8080;
    }

    # 그 외 — keycloak (auth)
    location / {
        proxy_pass http://keycloak-container:8080;
    }
}
}
